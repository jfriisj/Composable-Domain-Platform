# Dependency and plugin versions are added only when their implementation enters scope.

[versions]
archunit = "1.4.2"
flyway = "12.8.1"
jooq = "3.21.6"
junit = "5.14.4"
openapi-generator = "7.24.0"
postgresql = "42.7.11"
spring-boot = "4.1.0"
testcontainers = "2.0.5"

[libraries]
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api" }
jooq = { module = "org.jooq:jooq", version.ref = "jooq" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter.module = "org.junit.jupiter:junit-jupiter"
junit-platform-launcher.module = "org.junit.platform:junit-platform-launcher"
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-context = { module = "org.springframework:spring-context" }
spring-test = { module = "org.springframework:spring-test" }
spring-web = { module = "org.springframework:spring-web" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }

[plugins]
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
