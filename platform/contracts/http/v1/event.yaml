openapi: 3.0.3
info:
  title: Composable Domain Platform Event API
  version: 1.0.0
  description: >
    Version 1 HTTP contract for Event definition, retrieval, publication,
    discovery, and participant-private Event-registration lifecycle.
servers:
  - url: /
tags:
  - name: Event
  - name: EventRegistration
paths:
  /api/v1/events:
    get:
      tags:
        - Event
      operationId: discoverEvents
      summary: Discover published Events
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Published Events discovered
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponse'
        '500':
          description: Unexpected internal failure
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Event
      operationId: defineEvent
      summary: Define an Event
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefineEventRequest'
      responses:
        '201':
          description: Event defined
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Structurally or domain-invalid Event definition
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Event identity already exists
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected internal failure
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/events/{eventId}:
    get:
      tags:
        - Event
      operationId: findEventById
      summary: Retrieve an Event by identity
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Event found
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Structurally invalid Event identity
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event identity is unknown
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected internal failure
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/events/{eventId}/publication:
    post:
      tags:
        - Event
      operationId: publishEvent
      summary: Publish an Event for participant discovery
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Event published
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '400':
          description: Structurally invalid Event identity
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event identity is unknown
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Event is already published
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected internal failure
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/event-registrations:
    post:
      tags:
        - EventRegistration
      operationId: createEventRegistration
      summary: Register the authenticated participant in an existing Event
      security:
        - ParticipantBasicAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRegistrationRequest'
      responses:
        '201':
          description: Event registration created
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRegistrationResponse'
        '400':
          description: Structurally or domain-invalid Event registration request
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Participant authentication is required or credentials are invalid
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Referenced Event does not exist
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Registration uniqueness conflict
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected internal failure
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/event-registrations/{registrationId}:
    get:
      tags:
        - EventRegistration
      operationId: findEventRegistrationById
      summary: Retrieve the authenticated participant's Event-registration state
      security:
        - ParticipantBasicAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Event registration found
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRegistrationResponse'
        '400':
          description: Structurally invalid Registration identity
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Participant authentication is required or credentials are invalid
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Private Event registration is unknown or not visible to this participant
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected internal failure
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - EventRegistration
      operationId: cancelEventRegistration
      summary: Cancel the authenticated participant's Event registration
      security:
        - ParticipantBasicAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Event registration cancelled
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRegistrationResponse'
        '400':
          description: Structurally invalid Registration identity
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Participant authentication is required or credentials are invalid
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Private Event registration is unknown or not visible to this participant
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected internal failure
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    ParticipantBasicAuth:
      type: http
      scheme: basic
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: >
        Opaque correlation identifier. A supplied non-blank value is preserved.
        When absent, the HTTP boundary creates one.
      schema:
        type: string
        minLength: 1
        pattern: '.*\S.*'
    EventId:
      name: eventId
      in: path
      required: true
      description: Event identity
      schema:
        type: string
        minLength: 1
        pattern: '.*\S.*'
    RegistrationId:
      name: registrationId
      in: path
      required: true
      description: Registration identity
      schema:
        type: string
        minLength: 1
        pattern: '.*\S.*'
  headers:
    CorrelationId:
      description: >
        Opaque correlation identifier established for the request. Every
        response returns this header.
      schema:
        type: string
        minLength: 1
  schemas:
    DefineEventRequest:
      type: object
      additionalProperties: false
      required:
        - eventId
        - name
        - slug
        - startsAt
        - endsAt
        - timezone
      properties:
        eventId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        timezone:
          type: string
          minLength: 1
    EventResponse:
      type: object
      additionalProperties: false
      required:
        - eventId
        - name
        - slug
        - startsAt
        - endsAt
        - timezone
      properties:
        eventId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        timezone:
          type: string
          minLength: 1
    CreateEventRegistrationRequest:
      type: object
      additionalProperties: false
      required:
        - registrationId
        - eventId
      properties:
        registrationId:
          type: string
          minLength: 1
        eventId:
          type: string
          minLength: 1
    EventRegistrationResponse:
      type: object
      additionalProperties: false
      required:
        - registrationId
        - eventId
        - lifecycle
      properties:
        registrationId:
          type: string
          minLength: 1
        eventId:
          type: string
          minLength: 1
        lifecycle:
          $ref: '#/components/schemas/EventRegistrationLifecycle'
    EventRegistrationLifecycle:
      type: string
      enum:
        - active
        - cancelled
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - authentication_required
            - event_not_found
            - event_already_defined
            - event_already_published
            - event_registration_not_found
            - registration_conflict
            - internal_error
        message:
          type: string
          minLength: 1
