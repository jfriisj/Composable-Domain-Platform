name: Ready work
description: Track work that is already authorized and ready from accepted repository state.
title: "[Work] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form only for ready work. Governance and Definition of Done remain authoritative in `docs/governance.md`; do not restate them here.
        If scope, ownership, architecture, or technology is unresolved, use the Decision / scope candidate form instead.

  - type: textarea
    id: outcome
    attributes:
      label: Exact outcome
      description: What single coherent outcome will this work deliver?
    validations:
      required: true

  - type: input
    id: references
    attributes:
      label: Goal / authority / dependency references
      description: Add only relevant Goal, accepted authority, Blocked by, or Blocks references. Leave blank when none are needed.
      placeholder: "Example: Goal: #123; Blocked by #124; docs/scope.md"

  - type: textarea
    id: impact
    attributes:
      label: Affected authorities or boundaries
      description: List only actual ownership, contract, persistence, integration, runtime, architecture, or authoritative-source impact. Leave blank when none.

  - type: textarea
    id: out_of_scope
    attributes:
      label: Material exclusions
      description: State adjacent work deliberately excluded only when that boundary matters for this issue.

  - type: textarea
    id: validation
    attributes:
      label: Acceptance / validation
      description: What objective evidence demonstrates that this outcome is complete?
    validations:
      required: true
